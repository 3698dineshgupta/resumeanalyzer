services:
  # Backend
  - type: web
    name: resume-analyzer-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    rootDir: backend
    envVars:
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        fromService:
          type: web
          name: resume-analyzer-frontend
          property: host
      - key: MONGO_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true

  # Frontend
  - type: web
    name: resume-analyzer-frontend
    env: node
    buildCommand: npm install && npm run build
    publishDir: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://resume-analyzer-backend.onrender.com/api
